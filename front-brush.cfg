# SexPistols front brush. Coordinates supplied by Ed; physical path not tested.
# BRUSH_CLEAN is manual / clear-bed only. _AUTO_FRONT_BRUSH handles tool changes.
# Coordinates are absolute G-code nozzle coordinates; preserve active tool offsets.
[gcode_macro BRUSH_CLEAN]
description: Clear-bed front brush, one +10mm X stroke; no heating or extrusion
variable_start_x: 240.0
variable_start_y: 3.45
variable_brush_z: 3.0
variable_stroke_x: 10.0
gcode:
    {% set b = printer['gcode_macro BRUSH_CLEAN'] %}
    {% set p = printer.gcode_move.gcode_position %}
    {% set tc = printer.toolchanger %}
    {% set dry = params.DRY_RUN|default(0)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] or printer.pause_resume.is_paused or printer['gcode_macro PRINT_START'].printing %}
        {action_raise_error('BRUSH_CLEAN: fixed Z3 brush is not enabled during prints or pauses.')}
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error('BRUSH_CLEAN: home XYZ first; no automatic homing.')}
    {% endif %}
    {% if tc.status != 'ready' or not tc.tool or tc.tool_number|int < 0 %}
        {action_raise_error('BRUSH_CLEAN: a known mounted tool is required.')}
    {% endif %}
    {% if tc.has_detection and tc.detected_tool_number != tc.tool_number %}
        {action_raise_error('BRUSH_CLEAN: detected tool does not match active tool.')}
    {% endif %}
    {% if p.z > 20 %}
        {action_raise_error('BRUSH_CLEAN: manually position below Z20 on a clear bed first; high-Z/dock approach is not verified.')}
    {% endif %}
    {% set safe_z = [10.0, p.z + 3.0]|max %}
    {% set end_x = b.start_x + b.stroke_x %}
    {% set delta = [printer.toolhead.position.x-p.x, printer.toolhead.position.y-p.y, printer.toolhead.position.z-p.z] %}
    {% for pt in [(b.start_x,b.start_y,safe_z), (b.start_x,b.start_y,b.brush_z), (end_x,b.start_y,b.brush_z), (end_x,b.start_y,safe_z)] %}
        {% for axis in range(3) %}
            {% if pt[axis]+delta[axis] < printer.toolhead.axis_minimum[axis] or pt[axis]+delta[axis] > printer.toolhead.axis_maximum[axis] %}
                {action_raise_error('BRUSH_CLEAN: brush path exceeds axis limits with active offsets.')}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% if dry %}
        {action_respond_info('BRUSH_CLEAN dry run: lift to Z%s; X%s Y%s; Z%s; wipe X%s; lift Z%s. No movement.' % (safe_z,b.start_x,b.start_y,b.brush_z,end_x,safe_z))}
    {% else %}
        VERIFY_TOOL_DETECTED T={tc.tool_number}
        SAVE_GCODE_STATE NAME=front_brush_state
        G90
        G1 Z{safe_z} F600
        G1 X{b.start_x} Y{b.start_y} F3000
        G1 Z{b.brush_z} F600
        G1 X{end_x} F1200
        G1 Z{safe_z} F600
        M400
        RESTORE_GCODE_STATE NAME=front_brush_state MOVE=0
    {% endif %}

# Fixed-bed brush: front Y<50 must be kept clear, INCLUDING supports/prime tower.
# The object polygon gate cannot detect every auxiliary slicer structure.
# Called only inside a real hot tool change, before tool offsets are restored.
[gcode_macro _AUTO_FRONT_BRUSH]
description: Three brush round trips during pickup before final position restore
variable_enabled: True
variable_front_clear_y: 50.0
variable_passes: 3
gcode:
    {% set cfg = printer['gcode_macro _AUTO_FRONT_BRUSH'] %}
    {% set tc = printer.toolchanger %}
    {% set active_print = printer.print_stats.state in ['printing','paused'] or printer['gcode_macro PRINT_START'].printing %}
    {% if cfg.enabled and tc.status == 'changing' and tc.tool and printer[printer.toolhead.extruder].can_extrude and printer[printer.toolhead.extruder].target > 0 %}
        {% if printer.toolhead.homed_axes != 'xyz' %}
            {action_raise_error('Front brush: XYZ must be homed.')}
        {% endif %}
        {% if tc.has_detection and tc.detected_tool_number != tc.tool_number %}
            {action_raise_error('Front brush: tool detection mismatch.')}
        {% endif %}
        {% set objects = printer.exclude_object.objects %}
        {% if active_print and not objects %}
            {action_raise_error('Front brush: object polygons required during prints to check the front clearance strip.')}
        {% endif %}
        {% for obj in objects %}
            {% if obj.name not in printer.exclude_object.excluded_objects %}
                {% if not obj.polygon %}
                    {action_raise_error('Front brush: missing object polygon.')}
                {% endif %}
                {% for point in obj.polygon %}
                    {% if point[1] < cfg.front_clear_y %}
                        {action_raise_error('Front brush: keep objects, supports and prime tower behind Y50. Object occupies the reserved front strip.')}
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endfor %}
        {% set b = printer['gcode_macro BRUSH_CLEAN'] %}
        {% set t = printer[tc.tool] %}
        {% set fast = t.params_fast_speed|float %}
        # Toolchanger clears all G-code offsets during its callback. Convert
        # nozzle coordinates explicitly; don't change the outer saved state.
        {% set origin = printer.gcode_move.homing_origin %}
        {% if origin.x|abs > 0.00001 or origin.y|abs > 0.00001 or origin.z|abs > 0.00001 %}
            {action_raise_error('Front brush: unexpected nonzero offsets inside tool-change callback.')}
        {% endif %}
        {% set x = b.start_x + t.gcode_x_offset %}
        {% set y = b.start_y + t.gcode_y_offset %}
        {% set z = b.brush_z + t.gcode_z_offset %}
        {% set approach_z = z + 2.0 %}
        {% set end_x = x + b.stroke_x %}
        {% set p = printer.gcode_move.gcode_position %}
        {% set return_z = params.RETURN_Z|default(p.z)|float %}
        {% set safe_z = [return_z + 3.0, 10.0]|max %}
        {% set passes = cfg.passes|int %}
        {% if passes < 1 or passes > 10 %}
            {action_raise_error('Front brush: passes must be between 1 and 10.')}
        {% endif %}
        {% set delta = [printer.toolhead.position.x-p.x,printer.toolhead.position.y-p.y,printer.toolhead.position.z-p.z] %}
        {% for point in [(x,y,safe_z),(x,y,approach_z),(x,y,z),(end_x,y,z),(x,y,safe_z),(x,p.y,safe_z)] %}
            {% for axis in range(3) %}
                {% if point[axis]+delta[axis] < printer.toolhead.axis_minimum[axis] or point[axis]+delta[axis] > printer.toolhead.axis_maximum[axis] %}
                    {action_raise_error('Front brush: insufficient axis travel for wiping and safe return.')}
                {% endif %}
            {% endfor %}
        {% endfor %}
        VERIFY_TOOL_DETECTED T={tc.tool_number}
        SAVE_GCODE_STATE NAME=auto_front_brush_state
        G90
        G1 Z{safe_z} F{fast}
        G1 X{x} F3000
        G1 Y{y} F3000
        G1 Z{approach_z} F{fast}
        G1 Z{z} F600
        {% for wipe in range(passes) %}
        G1 X{end_x} F1200
        G1 X{x} F1200
        {% endfor %}
        G1 Z{safe_z} F{fast}
        G1 Y{p.y} F3000
        M400
        RESTORE_GCODE_STATE NAME=auto_front_brush_state MOVE=0
    {% endif %}
