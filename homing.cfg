[force_move]
enable_force_move: True

[gcode_macro _HOME_X]
variable_away: 15.0
gcode:
  SAVE_GCODE_STATE NAME=__HOME_X
  G90
  G28 X
  M400

  {% set away = printer["gcode_macro _HOME_X"].away|float %}
  {% set sx = printer.configfile.settings["stepper_x"] %}
  {% set x_end = sx.position_endstop|float %}
  {% set x_max = sx.position_max|float %}
  {% set dir = -1 if x_end >= (x_max - 0.001) else 1 %}  # MAX endstop => move negative, else positive

  G91
  G1 X{dir * away} F12000
  M400
  RESTORE_GCODE_STATE NAME=__HOME_X


[gcode_macro _HOME_Y]
variable_away: 15.0
gcode:
  SAVE_GCODE_STATE NAME=__HOME_Y
  G90
  G28 Y
  M400

  {% set away = printer["gcode_macro _HOME_Y"].away|float %}
  {% set sy = printer.configfile.settings["stepper_y"] %}
  {% set y_end = sy.position_endstop|float %}
  {% set y_max = sy.position_max|float %}
  {% set dir = -1 if y_end >= (y_max - 0.001) else 1 %}

  G91
  G1 Y{dir * away} F12000
  M400
  RESTORE_GCODE_STATE NAME=__HOME_Y


[homing_override]
axes: xyz
gcode:
  SAVE_GCODE_STATE NAME=__HOMING_OVERRIDE

  {% set home_all = ('Y' not in params) and ('X' not in params) and ('Z' not in params) %}

  DETECT_ACTIVE_TOOL_PROBE
  START_CRASH_DETECTION
  # Safe Z lift even if Z isn't homed yet:
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z=0
  {% endif %}
  G91
  G1 Z5 F1500
  G90

  {% if home_all or ('X' in params) %}
    _HOME_X
  {% endif %}

  {% if home_all or ('Y' in params) %}
    _HOME_Y
  {% endif %}



  {% if home_all or ('Z' in params) %}
    G90
    G1 X150 Y150 F20000
    G28 Z
    _ADJUST_Z_HOME_FOR_TOOL_OFFSET
  {% endif %}

  _APPLY_ACTIVE_TOOL_GCODE_OFFSETS
  M400
  RESTORE_GCODE_STATE NAME=__HOMING_OVERRIDE



[gcode_macro _ADJUST_Z_HOME_FOR_TOOL_OFFSET]
gcode:
      G90 ; absolute mode
      G0 Z10 F1000
      {% set tool = printer.toolchanger.tool %}
      {% if tool %}
         {% set tool_z_offset = printer[tool].gcode_z_offset %}
         {% set probe_z_offset = printer.tool_probe_endstop.active_tool_probe_z_offset %}
         SET_KINEMATIC_POSITION Z={10.0+tool_z_offset|float+probe_z_offset|float}
      {% endif %}

[gcode_macro _APPLY_ACTIVE_TOOL_GCODE_OFFSETS]
gcode:
    ; Apply gcode offsets
    {% set tool = printer.toolchanger.tool %}
    {% if tool %}
      SET_GCODE_OFFSET X={printer[tool].gcode_x_offset} Y={printer[tool].gcode_y_offset} Z={printer[tool].gcode_z_offset}
    {% endif %}

