

[quad_gantry_level]
gantry_corners:
	-60,-10
	360,370
points:
	25,25
	25,250
	270,250
	270,25
speed: 1000
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0025 # 0.0075
max_adjust: 10

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2.0  # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}


[gcode_macro TOOLCHANGE_DEMO]
gcode:
    {% for n in range(10) %}
      T{ printer.toolchanger.tool_numbers | random }
    {% endfor %}


[gcode_macro PRINT_START]
variable_printing: False
gcode:
  {% set TOOL         = params.TOOL       | default(0)   | int %}
  {% set TOOL_TEMP    = params.TOOL_TEMP  | default(210) | int %}
  {% set BED_TEMP     = params.BED_TEMP   | default(60)  | int %}
  {% set CHAMBER_TEMP = params.CHAMBER    | default(40)  | int %}
  {% set x_wait       = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait       = printer.toolhead.axis_maximum.y|float / 2 %}

  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
  M117 Initializing

  # Bed heat + nozzle preheat to probing temperature.
  # SAFETY-FIX (see astra-xhigh-review 2.4): removed the bogus 'G4 S500' (missing P
  # parameter -> requested ZERO dwell, misleading) and the undefined 'M191 S35' (no
  # such command exists; it only emitted an informational error and continued). The
  # chamber/soak policy below is the real thermal stabilisation.
  M117 Heating bed
  M190 S{BED_TEMP}
  M109 T0 S150

  # Home with the toolchanger's homing_override (handles its own tool init).
  # Single homing pass here; Z is re-established after the soak below, so a second
  # full G28 before soak is unnecessary (review 5 / avoid duplicate homing).
  M117 Homing
  SET_LED LED=chamber_lighting RED=1 GREEN=0 BLUE=0 WHITE=0
  G28
  T0

  # Bed/chamber soak BEFORE establishing leveling references, so QGL / Z-home /
  # Beacon calibration are performed at the stabilised print temperature instead of
  # cold (review 2.4: references were previously set before the soak).
  {% if BED_TEMP > 90 %}
    G1 X{x_wait} Y{y_wait} Z15 F9000
    SET_DISPLAY_TEXT MSG="Bed: {BED_TEMP}c"
    M106 S255
    SET_PIN PIN=nevermore VALUE=1
    M190 S{BED_TEMP}
    SET_DISPLAY_TEXT MSG="Heatsoak: {CHAMBER_TEMP}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP}
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {BED_TEMP}c"
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{BED_TEMP}
    SET_DISPLAY_TEXT MSG="Soak for 5min"
    G4 P300000
  {% endif %}

  # Establish leveling / references AFTER the soak.
  M117 Quad Gantry Level
  QUAD_GANTRY_LEVEL
  G28 Z
  BEACON_AUTO_CALIBRATE
  # Clear old mesh
  BED_MESH_CLEAR

  # Mesh. KAMP wraps BED_MESH_CALIBRATE; ADAPTIVE=1 is not required (KAMP active
  # wrapper handles adaptive selection). Kept as a plain call.
  M117 Calibrating bed
  SET_LED LED=chamber_lighting RED=0.5 GREEN=0 BLUE=0.5 WHITE=0
  BED_MESH_CALIBRATE

  # Select active tool and wait for temp (per README pattern)
  {% if TOOL >= 0 %}
    M104 T0 S0
    T{TOOL}
    {% set initialToolTemp = 'T' ~ TOOL|string ~ '_TEMP' %}
    {% if initialToolTemp in params %}
      M117 Waiting on T{TOOL} S{params[initialToolTemp]}C
      M109 S{params[initialToolTemp]}
    {% else %}
      M109 S{TOOL_TEMP}
    {% endif %}
  {% else %}
    M109 S{TOOL_TEMP}
  {% endif %}

  # Enable the tool_crash detector for the print (new leave-on detector; see
  # tool_crash / toolcrash.cfg). This is the correct new-detector command.
  START_TOOL_CRASH_DETECTION


  # Your purge + status stuff
  SET_DISPLAY_TEXT MSG="Printing"
  SET_LED LED=chamber_lighting RED=0 GREEN=0 BLUE=0 WHITE=1
  G0 Y{y_wait} F10000
  G4 P500
  G0 X{x_wait - 50} F10000
  G4 P500
  G0 Z1.5

  VORON_PURGE

  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=True
  M117 Printing


[gcode_macro PRINT_END]
# Robust, UNCONDITIONAL basic shutdown FIRST. This outer body renders with no tool
# lookup and no undefined access, so it always executes - even from an idle /
# uninitialised / null-tool state. (Review 1.2: the old body did
# `printer[printer.toolchanger.tool]` during rendering; with tool==null this raised
# UndefinedError at render time, so NONE of the shutdown - not even TURN_OFF_HEATERS
# - ran.) All position/tool-dependent motion is deferred to _PRINT_END_PARK, which
# is a separate command and is therefore rendered only AFTER this body has already
# executed (two-phase), and is itself fully guarded.
#
# Legacy note: the old guarded `STOP_CRASH_DETECTION` call here targeted the OLD
# tool_probe crash detector (inert with the new tool_crash module) and is removed as
# misleading cleanup. The new tool_crash detector is intended to be left enabled;
# UNSELECT_TOOL / late-edge lifecycle behaviour is documented in TESTING.md as
# pending controlled hardware testing (review 3).
gcode:
    M400                           ; wait for buffer to clear
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False

    # Cold-safe retract: only when an extruder is active AND hot enough to extrude.
    # After G92 E0 the retract is the same in absolute or relative E mode.
    {% set ext = printer.toolhead.extruder %}
    {% if ext and printer[ext].can_extrude %}
      G92 E0
      G1 E-4.0 F3600               ; retract filament
      M400
    {% endif %}

    TURN_OFF_HEATERS
    M107                           ; part fan off

    # Optional, fully-guarded park. Separate call => rendered after the above ran.
    _PRINT_END_PARK

    M18                            ; disable steppers (Z is leadscrew-driven and holds)
    M117 Print done

[gcode_macro _PRINT_END_PARK]
# Guarded clearance + park helper for PRINT_END. Does NOTHING unsafe when the
# machine is not homed or no tool is known. Clearance is an UPWARD-ONLY Z move that
# can never descend (review 1.1: the old trajectory produced net-negative Z moves,
# e.g. Z278->Z275, and a descending combined XYZ park). Coordinates are computed and
# commanded consistently in the gcode frame (gcode_position + homing_origin) so tool
# gcode-offsets cannot cause Z over-travel or an unexpected descent.
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'x' in homed and 'y' in homed and 'z' in homed %}
        {% set off_z  = printer.gcode_move.homing_origin.z|float %}
        {% set max_z  = printer.toolhead.axis_maximum.z|float %}
        {% set cz_g   = printer.gcode_move.gcode_position.z|float %}
        {% set max_zg = max_z - off_z %}
        # Clearance target (gcode frame): near the top of travel, but never below the
        # current height (guarantees no descent) and never above the reachable ceiling.
        {% set park_zg = [max_zg - 5.0, [cz_g + 10.0, max_zg]|min]|max %}
        SAVE_GCODE_STATE NAME=_PRINT_END_PARK
        G90
        G0 Z{park_zg} F3600                        ; lift first (upward-only, no descent)
        {% set tool = printer.toolchanger.tool %}
        {% if tool %}
            # Lateral travel to the tool's dock X and configured safe Y, at the cleared
            # height. Remove active gcode-offsets so we target the physical location.
            {% set off_x = printer.gcode_move.homing_origin.x|float %}
            {% set off_y = printer.gcode_move.homing_origin.y|float %}
            {% set t = printer[tool] %}
            G0 X{t.params_park_x|float - off_x} Y{t.params_safe_y|float - off_y} F20000
        {% else %}
            RESPOND TYPE=echo MSG='PRINT_END: no active tool; toolhead left lifted (no lateral park).'
        {% endif %}
        RESTORE_GCODE_STATE NAME=_PRINT_END_PARK
    {% else %}
        RESPOND TYPE=echo MSG='PRINT_END: axes not homed; skipping park (heaters already off).'
    {% endif %}

[gcode_macro APPLY_AND_SAVE_NEW_CALIBRATION_OFFSETS]
description: Apply + stage the most recent TOOL_CALIBRATE_TOOL_OFFSET result to the
             tool it was ACTUALLY measured on. Refuses stale / sensor-location /
             wrong-tool results (review 2.3). Run SAVE_CONFIG yourself afterwards to
             persist (this macro does NOT restart the printer).
#
# The old body used `printer.printer.lookup_object(...)`, `__setattr__` and `cfg.set`
# - none of which exist in Klipper's sandboxed template environment - so it emitted
# no G-code and could (per review 2.3) assign a T4 measurement to T0 via the stale
# `last_result`. This version verifies provenance recorded by the wrapped
# TOOL_CALIBRATE_TOOL_OFFSET (see user-overrides.cfg: _CALIB_RESULT), confirms the
# recorded result still matches the live last_result, then stages it to the correct
# tool section using the NATIVE, supported TOOL_CALIBRATE_SAVE_TOOL_OFFSET command.
gcode:
    {% set rec    = printer['gcode_macro _CALIB_RESULT'] %}
    {% set active = printer.toolchanger.tool %}
    {% set live   = printer.tools_calibrate.last_result %}
    {% if not rec.valid %}
        { action_raise_error("No recorded calibration result. Run TOOL_CALIBRATE_TOOL_OFFSET first.") }
    {% elif rec.kind != 'offset' %}
        { action_raise_error("Last calibration result is a '%s' location, not a tool offset - refusing to save. Run TOOL_CALIBRATE_TOOL_OFFSET." % rec.kind) }
    {% elif rec.tool != (active|string) %}
        { action_raise_error("Recorded offset belongs to '%s' but the active tool is '%s'. Select the measured tool or re-calibrate." % (rec.tool, active)) }
    {% elif (rec.x - live[0])|abs > 0.0005 or (rec.y - live[1])|abs > 0.0005 or (rec.z - live[2])|abs > 0.0005 %}
        { action_raise_error("Recorded result no longer matches tools_calibrate.last_result (stale). Re-run TOOL_CALIBRATE_TOOL_OFFSET immediately before saving.") }
    {% else %}
        # Apply live to the active tool's gcode transform (consistent with config).
        SET_GCODE_OFFSET X={rec.x} Y={rec.y} Z={rec.z}
        # Stage to the CORRECT tool section for SAVE_CONFIG (native uses last_result,
        # which we validated above == the recorded result for THIS tool).
        TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="{active}" ATTRIBUTE=gcode_x_offset VALUE={% raw %}"{x:0.6f}"{% endraw %}
        TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="{active}" ATTRIBUTE=gcode_y_offset VALUE={% raw %}"{y:0.6f}"{% endraw %}
        TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="{active}" ATTRIBUTE=gcode_z_offset VALUE={% raw %}"{z:0.6f}"{% endraw %}
        RESPOND TYPE=echo MSG='Applied + staged offset {rec.x}, {rec.y}, {rec.z} to {active}. Run SAVE_CONFIG to persist.'
    {% endif %}


[gcode_macro UNSAFE_LOWER_BED]
description: RETIRED unsafe unhomed forced move - use INCREASE_Z_CLEARANCE instead.
gcode:
  { action_raise_error("UNSAFE_LOWER_BED is retired: it forced a blind ~-50mm move from a fabricated Z=50 origin regardless of the true position (review 1.4). If the machine is homed and you need clearance, use INCREASE_Z_CLEARANCE MM=<n>. To recover an unhomed machine, home it with G28.") }

[gcode_macro UNSAFE_RAISE_BED]
description: RETIRED unsafe unhomed forced move - use INCREASE_Z_CLEARANCE instead.
gcode:
  { action_raise_error("UNSAFE_RAISE_BED is retired: it forced a blind move from a fabricated Z=0 origin regardless of the true position (review 1.4). If the machine is homed and you need clearance, use INCREASE_Z_CLEARANCE MM=<n>; otherwise home it with G28.") }

[gcode_macro INCREASE_Z_CLEARANCE]
description: Homed-only: raise Z by MM (default 10, bounded 0<MM<=50) to create
             clearance. Never fabricates a kinematic position; upward-only; clamped
             to the machine ceiling. Safe replacement for the retired UNSAFE_* macros.
gcode:
  {% set mm = params.MM|default(10)|float %}
  {% if mm <= 0 %}
    { action_raise_error("INCREASE_Z_CLEARANCE: MM must be positive.") }
  {% elif mm > 50 %}
    { action_raise_error("INCREASE_Z_CLEARANCE: MM is capped at 50 for safety.") }
  {% elif 'z' not in printer.toolhead.homed_axes %}
    { action_raise_error("INCREASE_Z_CLEARANCE requires a homed Z axis. Run G28 first.") }
  {% else %}
    {% set off_z  = printer.gcode_move.homing_origin.z|float %}
    {% set max_z  = printer.toolhead.axis_maximum.z|float %}
    {% set cz_g   = printer.gcode_move.gcode_position.z|float %}
    {% set target = [cz_g + mm, max_z - off_z]|min %}
    SAVE_GCODE_STATE NAME=_INC_Z_CLEARANCE
    G90
    G0 Z{target} F600
    RESTORE_GCODE_STATE NAME=_INC_Z_CLEARANCE
  {% endif %}



[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box.
    # SAFETY-FIX (review 4.3): was `SMALLPATTERNSIZE|default(20)` which referenced an
    # undefined bare name and therefore ALWAYS fell back to 20. Read the actual
    # parameter and clamp it to a sane, positive range.
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}
    {% if smallpatternsize < 5 %}
        {% set smallpatternsize = 5 %}
    {% elif smallpatternsize > 200 %}
        {% set smallpatternsize = 200 %}
    {% endif %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x %}
        {% if x_min < 0 %}
            {% set x_min = 0 %}
        {% endif %}
    
        {% set y_min = printer.toolhead.axis_minimum.y %}
        {% if y_min < 0 %}
            {% set y_min = 0 %}
        {% endif %}
    
        {% set x_min = x_min + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = y_min + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED
    