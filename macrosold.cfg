#####################################################################
#   Positioning Macros
#####################################################################    

[gcode_macro UNSAFE_LOWER_BED]
description: Lower the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=100
  G0 Z0 F600
  M84

[gcode_macro UNSAFE_RAISE_BED]
description: Raise the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=0
  G0 Z100 F600
  M84

[gcode_macro _TAP_PROBE_ACTIVATE]
description: Ensure safe temp for bed probing
gcode:
    {% set max_temp = 150 %}
    {% set actual_temp = printer[params.HEATER].temperature %}
    {% set target_temp = printer[params.HEATER].target %}
    {% if target_temp > max_temp %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (target_temp, max_temp)) }
        SET_HEATER_TEMPERATURE HEATER={params.HEATER} TARGET={ max_temp|int - 5 }
    {% endif %}
    # Temperature target is already low enough, but nozzle may still be too hot.
    {% if actual_temp > max_temp  + 2 %}
        { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (actual_temp, max_temp)) }
        TEMPERATURE_WAIT SENSOR={params.HEATER} MAXIMUM={ max_temp }
    {% endif %}
    


########################################
# Print Start and Print End Macros
########################################
[gcode_macro PRINT_START]
variable_printing: False
gcode:

  
  M117 initializing  
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
  INITIALIZE_TOOLCHANGER
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set target_bed = params.BED_TEMP|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}

  # Homes and begins heating the buildplate
  M117 homing
  SET_LED LED=chamber_lighting RED=1 GREEN=0 BLUE=0 WHITE=0
  G28
  M109 T0 S150
  M140 S{params.BED_TEMP}

  #Cleans the nozzle
  M117 Cleaning the nozzle
  #_CLEAN_NOZZLE TEMP={ params.TOOL_TEMP|int - 30 }
  BED_MESH_CLEAR        # Clears old saved bed mesh (if any)

  # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED_TEMP|int > 90 %}
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    SET_DISPLAY_TEXT MSG="Bed: {
    
    
    
    
    target_bed}c"           # Displays info
    M106 S255                                           # Turns on the PT-fan
    SET_PIN PIN=nevermore VALUE=1                      # Turns on the nevermore
                                             # Heats the nozzle to 150c
    M190 S{target_bed}                                  # Sets the target temp for the bed
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Displays info
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp

  # If the bed temp is not over 90c, then it skips the heatsoak and just heats up to set temp with a 5min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M190 S{target_bed}                                  # Sets the target temp for the bed
    SET_DISPLAY_TEXT MSG="Soak for 5min"                # Displays info
    G4 P300000                                          # Waits 5 min for the bedtemp to stabilize
  {% endif %}

  # Re-homes the toolhead and calibrates bed mesh
  M117 Calibrating bed
  SET_LED LED=chamber_lighting RED=0.5 GREEN=0 BLUE=0.5 WHITE=0
  #G28 ; Home, gantry tram
  QUAD_GANTRY_LEVEL
  BED_MESH_CALIBRATE
  G28 Z

  # Preheat all the hotends in use (non-blocking)
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    {% set tooltemp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}
    {% if tooltemp_param in params %}
      M104 T{tool_nr} S{params[tooltemp_param]}
    {% endif %}
  {% endfor %}

  # Select active tool and wait for its print temp
  {% if params.TOOL is defined %}
    {% set active_tool = params.TOOL|int %}
    T{active_tool}
  {% else %}
    {% set active_tool = 0 %}
    T0
  {% endif %}

  M109 S{params.TOOL_TEMP}   ; wait only for active tool

  ; Optional: idle all other tools at 100°C (non-blocking)
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    {% if tool_nr != active_tool %}
      M104 T{tool_nr} S100
    {% endif %}
  {% endfor %}

  
  #G0 Z5 F300 ;Move up a bit
  #G92 E0 ; Zero extruder

  #_WIPE_NOZZLE
  
  
  SET_DISPLAY_TEXT MSG="Printing"          
  SET_LED LED=chamber_lighting RED=0 GREEN=0 BLUE=0 WHITE=1
  G0 Y{y_wait} F10000
  G4 P500
  G0 X{x_wait - 50}  F10000
  G4 P500
  G0 Z0.4                                          # Raises Z to 0.4
  
  VORON_PURGE
  
  #G1 X{x_wait} Y{y_wait} Z15 F9000
  START_TOOL_PROBE_CRASH_DETECTION
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=True
  M117 Printing

[gcode_macro SINGLE_TOOL_START]
# Usage: SINGLE_TOOL_START TOOL=1 BED_TEMP=110 TOOL_TEMP=240 CHAMBER=30
gcode:
  {% set tool        = params.TOOL|int %}
  {% set bed_temp    = params.BED_TEMP|int %}
  {% set tool_temp   = params.TOOL_TEMP|int %}
  {% set chamber_temp = params.CHAMBER|default(30)|int %}

  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  G90
  M117 single tool start
  # reuse the same "printing" flag if you want
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False

  # --- mount + home with THIS tool ---
  T{tool}
  INITIALIZE_TOOLCHANGER
  M117 homing (T{tool})
  G28

  M109 T{tool} S150
  M140 S{bed_temp}

  BED_MESH_CLEAR

  {% if bed_temp > 90 %}
    G1 X{x_wait} Y{y_wait} Z15 F9000
    SET_DISPLAY_TEXT MSG="Bed: {bed_temp}c"
    M106 S255
    SET_PIN PIN=nevermore VALUE=1
    M109 T{tool} S150
    M190 S{bed_temp}
    SET_DISPLAY_TEXT MSG="Heatsoak: {chamber_temp}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chamber_temp}
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {bed_temp}c"
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{bed_temp}
    SET_DISPLAY_TEXT MSG="Soak for 5min"
    G4 P300000
  {% endif %}

  M117 Calibrating bed (T{tool})
  QUAD_GANTRY_LEVEL
  BED_MESH_CALIBRATE
  G28
  G0 Z10 F3000

  # heat to print temp
  M109 T{tool} S{tool_temp}

  # purge line with this tool
  SET_DISPLAY_TEXT MSG="Printing"
  SET_LED LED=chamber_lighting RED=0 GREEN=0 BLUE=0 WHITE=1

  G90
  G0 Z2 F3000
  G0 X{x_wait - 50} Y13 F10000
  G0 Z0.4 F1000

  G91
  G1 X100 E20 F1000
  G0 Z2 F3000
  G90

  START_TOOL_PROBE_CRASH_DETECTION T={tool}
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=True
  M117 Brrrrrrr (T{tool})


[gcode_macro PRINT_END]
gcode:
    STOP_TOOL_PROBE_CRASH_DETECTION
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament

    G91                            ; relative positioning
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float - 0.5 %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float - 0.5 %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 20) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z - 5%}
    {% endif %}

    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    G0 Z{z_safe} F3600             ; move nozzle up
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-2.0 F1800                 ; retract filament

    TURN_OFF_HEATERS
    M107                           ; turn off fan

    G90                            ; absolute positioning
    {% set tool = printer[printer.toolchanger.tool] %}
    G0 X{tool.params_park_x} Y{tool.params_safe_y} Z{max_z-5} F3600          ; park nozzle up top
    M18                            ; Motors off
    M117 Print done
    #SET_LED LED=led RED=0 GREEN=0 BLUE=0


[gcode_macro PRINT_END]
gcode:
    {% if printer.tool_probe_endstop is defined %}
      STOP_CRASH_DETECTION
    {% endif %}

    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament

    G91                            ; relative positioning
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float - 0.5 %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float - 0.5 %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 20) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z - 5 %}
    {% endif %}

    G0 X{x_safe} Y{y_safe} F20000
    G0 Z{z_safe} F3600
    M400
    G92 E0
    G1 E-2.0 F1800

    TURN_OFF_HEATERS
    M107

    G90
    {% set tool = printer[printer.toolchanger.tool] %}
    {% set park_z = max_z - 5 %}
    {% if park_z < 0 %}
      {% set park_z = 0 %}
    {% endif %}
    G0 X{tool.params_park_x} Y{tool.params_safe_y} Z{park_z} F3600

    M18
    M117 Print done
    
#####################################################################
#   Filament Macros
#####################################################################    

[gcode_macro LOAD_FILAMENT]
variable_ignore_min_extrude_temp: True
gcode:
  M117 Loading
  M104 S240
  G90 ; Absolute pos
  G1 X100 Y20 Z20 F1800 ; Move to center
  M104 S240 ;Heat up the filament
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM=240
  M83                            ; set extruder to relative
  G1 E50 F300                   ; extrude 5 cm
  G1 E50 F300                   ; extrude 5 cm
  G1 E-4 F1800                  ; retract some
  M82                           ; set extruder to absolute
  M400                          ; wait for buffer to clear
  M104 S0                       ; Stop heating
  M117 Loading done

[gcode_macro UNLOAD_FILAMENT]
variable_ignore_min_extrude_temp: True
gcode:
  M117 Unloading
  M104 S240 ;Heat up the filament
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM=240
  M83                           ; set extruder to relative
  G1 E5 F500                   ; extrude 5 mm
  G1 E-50 F1000                   ; retract 5 cm
  G1 E-50 F1000                   ; retract 5 cm
  M82                            ; set extruder to absolute
  M400                          ; wait for buffer to clear
  TURN_OFF_HEATERS
  M117 Unloading done


[gcode_macro UNLOAD_ONE_FILAMENT]
gcode:
  M117 Unloading {params.TOOL}
  M109 T{params.TOOL} S240 ;Wait until heated
  {% set tool_name = printer.toolchanger.tool_names[params.TOOL|int] %}
  {% set extruder = printer[tool_name].extruder %}
  M104 T{params.TOOL} S240 ;Heat up the filament
  TEMPERATURE_WAIT SENSOR={extruder} MINIMUM=240
  ACTIVATE_EXTRUDER EXTRUDER={extruder}
  M83                           ; set extruder to relative
  G1 E5 F500                   ; extrude 5 mm
  G1 E-50 F1000                   ; retract 5 cm
  G1 E-50 F1000                   ; retract 5 cm
  M82                            ; set extruder to absolute
  M400                          ; wait for buffer to clear
  TURN_OFF_HEATERS
  M117 Unloading done

[gcode_macro UNLOAD_ALL_FILAMENT]
gcode:
  {% set tools = printer.toolchanger.tool_names %}
  M117 Unloading
  {% for tool in tools %}
    M104 T{printer[tool].tool_number} S240 ;Heat up the filament
  {% endfor %}
  {% for tool in tools %}
    M109 T{printer[tool].tool_number} S240 ;Wait until heated
    ACTIVATE_EXTRUDER EXTRUDER={printer[tool].extruder}
    M83                           ; set extruder to relative
    G1 E5 F500                     ; extrude 5 mm
    G1 E-50 F1000                   ; retract 5 cm
    G1 E-50 F1000                   ; retract 5 cm
  {% endfor %}
  M400                          ; Finish all th emoves
  M82                            ; set extruder to absolute
  TURN_OFF_HEATERS
  M117 Unloading done



