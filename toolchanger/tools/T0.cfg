#####################################################################
#   Toolhead Select Macro
#####################################################################
[gcode_macro T0]
variable_color: ""
gcode:
    SELECT_TOOL T=0

#####################################################################
#   Toolhead parameters
#####################################################################
[tool T0]
tool_number: 0
extruder: extruder
fan: T0_partfan
#params_type: 'sc'
#params_sc_path: [{'y':9.5 ,'z':8}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
#These are build specific, its where the tool is sitting in it's dock.
params_park_x: 13.3
params_park_y: 1
params_park_z: 247
params_safe_y: 100
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 62.4
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 88.6
params_input_shaper_damping_ratio_y: 0.01
detection_pin: !nhk:gpio10

## PCB Activity Light
[output_pin act_led]
pin: !nhk:gpio8

#####################################################################
#   Accelerometer
#####################################################################
[adxl345 T0]
cs_pin: nhk:gpio27
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19

[resonance_tester]
accel_chip: adxl345 T0
probe_points:
    155, 155, 20

#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor nhk]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100