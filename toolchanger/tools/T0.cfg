
[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
serial: /dev/serial/by-id/usb-Klipper_rp2040_4E363334320EB166-if00
restart_method: command

#####################################################################
# 	Extruder
#####################################################################
[extruder]
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25
heater_pin: nhk:gpio9
sensor_pin: nhk:gpio29
pullup_resistor: 2200
rotation_distance: 21.6 #Bondtech 5mm Drive Gears
gear_ratio: 50:10              ##  Use 50:10 for Sherpa Mini
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree
nozzle_diameter: 0.25
filament_diameter: 1.75
sensor_type: ATC Semitec 104NT-4-R025H42G
min_temp: 10
max_temp: 300
max_power: 0.9
min_extrude_temp: 170
control: pid 
pid_kp: 15.697
pid_ki: 1.113
pid_kd: 55.330
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.035
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.6        #recommend setting it below 0.7A.
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Fans
#####################################################################
## PCF
[fan_generic T0_partfan]
pin: nhk:gpio6
#kick_start_time: 1.0
#off_below: 0.10

## HEF
[heater_fan T0_hotend_fan]
pin: nhk:gpio5
#tachometer_pin: nhk:gpio16
#tachometer_ppr: 2
max_power: 1
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

#####################################################################
# 	Probe
#####################################################################
## Probe Port
