
[mcu nhk1]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_4E363334320FAC71-if00
restart_method: command
##--------------------------------------------------------------------

#####################################################################
#   Filament Sensor
#####################################################################
#[filament_switch_sensor filament_sensor]
#switch_pin: nhk1:gpio3
#pause_on_runout: True

#####################################################################
# 	Extruder - Uses Phaetus Rapido 1 HF
#####################################################################
[extruder1]
step_pin: nhk1:gpio23
dir_pin: nhk1:gpio24
enable_pin: !nhk1:gpio25
heater_pin: nhk1:gpio9
sensor_pin: nhk1:gpio29
pullup_resistor: 2200
rotation_distance: 21.6   #Bondtech 5mm Drive Gears
gear_ratio: 50:10              ##  Use 50:10 for Sherpa Mini
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree
nozzle_diameter: 0.25
filament_diameter: 1.75
sensor_type: ATC Semitec 104NT-4-R025H42G
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_kp: 18.786
pid_ki: 1.491
pid_kd: 59.175
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.035
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5

[tmc2209 extruder1]
sense_resistor: 0.100
uart_pin: nhk1:gpio0
tx_pin: nhk1:gpio1
interpolate: false
run_current: 0.6        #recommend setting it below 0.7A.
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Fans
#####################################################################
## PCF
[fan_generic T1_partfan]
pin: nhk1:gpio6
#kick_start_time: 1.0
#off_below: 0.10

## HEF
[heater_fan T1_hotend_fan]
pin: nhk1:gpio5
#tachometer_pin: nhk1:gpio16
#tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 50.0

#####################################################################
# 	Probe
#####################################################################
## Probe Port
#[tool_probe T1]
#pin: nhk1:gpio10
#tool: 1
#x_offset: 0 # X axis-sensor relative nozzle offset
#y_offset: 0 # Y axis-sensor relative nozzle offset
#z_offset: -0.7 # Z axis-sensor relative nozzle offset
# drop_first_result: True # enable is on danger-klipper
#speed: 5.0
#samples: 3
#samples_result: median
#sample_retract_dist: 2.0
#samples_tolerance: 0.02
#samples_tolerance_retries: 3
#activate_gcode:
#    _TAP_PROBE_ACTIVATE HEATER=extruder1

#####################################################################
#   Toolhead Select Macro
#####################################################################
[gcode_macro T1]
variable_color: ""
gcode:
    SELECT_TOOL T=1
    
#####################################################################
#   Toolhead parameters
#####################################################################

[tool T1]
tool_number: 1
extruder: extruder1
fan: T1_partfan
#params_type: 'sc'
#params_sc_path: [{'y':9.5 ,'z':8}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
#These are build specific, its where the tool is sittng in it's dock.
params_park_x: 81.5
params_park_y: 1.75
params_park_z: 248
params_safe_y: 100.0
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 62.4
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 88.6
params_input_shaper_damping_ratio_y: 0.01
detection_pin: !nhk1:gpio10
## PCB Activity Light
#[output_pin act_led]
#pin: !nhk1:gpio8

#####################################################################
#   Accelerometer
#####################################################################
[adxl345 T1]
cs_pin: nhk1:gpio27
spi_software_sclk_pin: nhk1:gpio18
spi_software_mosi_pin: nhk1:gpio20
spi_software_miso_pin: nhk1:gpio19

[resonance_tester]
accel_chip: adxl345 T1
probe_points:
    155, 155, 20

#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor nhk1]
sensor_type: temperature_mcu
sensor_mcu: nhk1
min_temp: 0
max_temp: 100