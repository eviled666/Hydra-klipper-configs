##############################################################################
# user-overrides.cfg
#
# USER-OWNED late-override config for the confirmed SexPistols safety fixes.
# It is [include]d from printer.cfg AFTER toolchanger/readonly-configs/
# toolchanger-include.cfg and must remain the LAST include before the
# SAVE_CONFIG block, so the sections/macros here win the Klipper
# same-section-key merge over the read-only upstream symlinked configs.
#
# NOTHING here edits the read-only upstream symlink targets under
# /home/pi/klipper-toolchanger-easy/... or the Mainsail config. Everything is
# expressed as an override merged on top of them.
#
# Dependency provenance for the RESUME body below: copied from the effective
# Mainsail client macros (mainsail-config), tracking upstream revision ff3869a.
#
# Klipper gcode_macro Jinja uses SINGLE-brace delimiters: `{ expr }` for
# expressions and `{% %}` for statements. Literal braces (e.g. the python
# format template consumed by TOOL_CALIBRATE_SAVE_TOOL_OFFSET) are emitted with
# {% raw %}...{% endraw %}.
##############################################################################


##############################################################################
# 1. Input shaping (review 2.5)
#
# There was NO effective [input_shaper] section, so SET_INPUT_SHAPER was an
# unknown command and the per-tool shaper TYPE and DAMPING_RATIO were never
# applied - only the frequencies were. We add the section (making the command
# available) and, below, a per-tool callback that applies type + freq + damping.
#
# These startup defaults mirror the EXISTING configured T0 values. They are the
# values already present in the tool configs (mzv, 62.4/88.6 Hz, 0.01 damping);
# they are NOT newly measured. The user must validate real resonance
# measurements later (see TESTING.md).
##############################################################################
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 62.4
damping_ratio_x: 0.01
shaper_type_y: mzv
shaper_freq_y: 88.6
damping_ratio_y: 0.01


##############################################################################
# 2. Toolchanger after_change callback - apply FULL per-tool shaper (review 2.5)
#
# Overrides only the after_change_gcode option of [toolchanger]. Reproduces the
# original tool-colour behaviour and extends the SET_INPUT_SHAPER call to pass
# TYPE and DAMPING_RATIO (all five tools define type_*/freq_*/damping_ratio_*).
##############################################################################
[toolchanger]
after_change_gcode:
    {% set tn = "T"+(tool.tool_number|string) %}
    {% if printer["gcode_macro " + tn ] %}
       SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'c44'"
    {% endif %}
    {% if tool.params_input_shaper_freq_x %}
      SET_INPUT_SHAPER SHAPER_TYPE_X={tool.params_input_shaper_type_x} SHAPER_FREQ_X={tool.params_input_shaper_freq_x} DAMPING_RATIO_X={tool.params_input_shaper_damping_ratio_x} SHAPER_TYPE_Y={tool.params_input_shaper_type_y} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y} DAMPING_RATIO_Y={tool.params_input_shaper_damping_ratio_y}
    {% endif %}


##############################################################################
# 3. RESUME - restore the full Mainsail recovery body + tool verification
#    (review 1.3)
#
# The effective RESUME had been replaced by the toolchanger's 3-line body
# (INITIALIZE_TOOLCHANGER / VERIFY_TOOL_DETECTED / RESUME_BASE), which BYPASSED
# Mainsail's reheat, unretract (_CLIENT_EXTRUDE), idle-state handling, runout
# gating, timeout restore, user hook and velocity handling.
#
# This override is the EXACT Mainsail RESUME body (upstream ff3869a) with the
# toolchanger initialise+verify inserted surgically - only AFTER the paused /
# heat / runout eligibility checks have passed, and immediately before
# RESUME_BASE. VERIFY_TOOL_DETECTED raises on failure, which aborts the macro
# BEFORE RESUME_BASE so the print position is NOT resumed on a tool fault.
#
# This is a real merged override (last include wins); it does NOT rely on
# reversing include order (which would instead drop the toolchanger body).
##############################################################################
[gcode_macro RESUME]
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""     # no runout
                    else True if not printer[client.runout_sensor].enabled  # sensor is disabled
                    else printer[client.runout_sensor].filament_detected %} # sensor status
  {% set can_extrude = True if printer.toolhead.extruder == ''           # no extruder defined in config
                  else printer[printer.toolhead.extruder].can_extrude %} # status of active extruder
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####
  #### Printer comming from timeout idle state ####
  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      # we need to use the unicode (°) for the ° as py2 env's would throw an error otherwise
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f°C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  #### Printer comming out of regular PAUSE state ####
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}
  {% if runout_resume %}
    {% if do_resume %}
      {% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %} # restore idle_timeout time
      {client.user_resume_macro|default("")}
      _CLIENT_EXTRUDE
      # --- toolchanger safety: initialise + verify the tool ONLY after the
      # --- paused / heat / runout eligibility checks above have passed.
      # --- VERIFY_TOOL_DETECTED raises on failure -> the macro aborts here and
      # --- RESUME_BASE never runs, so the print position is NOT resumed.
      INITIALIZE_TOOLCHANGER
      VERIFY_TOOL_DETECTED
      RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}
  ##### Generate User Information box in case of abort #####
  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


##############################################################################
# 4. Calibration: provenance-tracked offset ownership (review 2.1/2.2/2.3)
##############################################################################

# Provenance record of the most recent tool-calibration result. Written by
# _RECORD_CALIB_RESULT after a native calibration command completes.
[gcode_macro _CALIB_RESULT]
description: Internal - provenance of the most recent tool calibration result.
variable_valid: False
variable_kind: 'none'      # 'offset' | 'sensor' | 'none'
variable_tool: 'none'      # tool object name the result belongs to, e.g. 'tool T1'
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
gcode:
    RESPOND TYPE=echo MSG='calib result: valid={printer["gcode_macro _CALIB_RESULT"].valid} kind={printer["gcode_macro _CALIB_RESULT"].kind} tool={printer["gcode_macro _CALIB_RESULT"].tool} xyz={printer["gcode_macro _CALIB_RESULT"].x},{printer["gcode_macro _CALIB_RESULT"].y},{printer["gcode_macro _CALIB_RESULT"].z}'

# Capture tools_calibrate.last_result together with WHICH tool it belongs to and
# WHAT kind of result it is. Invoked as a separate command after the native
# command has executed, so last_result is already populated (two-phase render).
[gcode_macro _RECORD_CALIB_RESULT]
description: Internal - record last_result with provenance (tool + kind).
gcode:
    {% set kind = params.KIND|default('offset') %}
    {% set r    = printer.tools_calibrate.last_result %}
    {% set tool = printer.toolchanger.tool %}
    SET_GCODE_VARIABLE MACRO=_CALIB_RESULT VARIABLE=kind  VALUE="'{kind}'"
    SET_GCODE_VARIABLE MACRO=_CALIB_RESULT VARIABLE=tool  VALUE="'{tool}'"
    SET_GCODE_VARIABLE MACRO=_CALIB_RESULT VARIABLE=x     VALUE={r[0]}
    SET_GCODE_VARIABLE MACRO=_CALIB_RESULT VARIABLE=y     VALUE={r[1]}
    SET_GCODE_VARIABLE MACRO=_CALIB_RESULT VARIABLE=z     VALUE={r[2]}
    SET_GCODE_VARIABLE MACRO=_CALIB_RESULT VARIABLE=valid VALUE=True

# Wrap the native TOOL_CALIBRATE_TOOL_OFFSET so every measurement records that it
# is an 'offset' result belonging to the currently active tool.
[gcode_macro TOOL_CALIBRATE_TOOL_OFFSET]
rename_existing: _BASE_TOOL_CALIBRATE_TOOL_OFFSET
description: Calibrate active tool offset vs T0, then record result provenance.
gcode:
    _BASE_TOOL_CALIBRATE_TOOL_OFFSET {rawparams}
    _RECORD_CALIB_RESULT KIND=offset

# Wrap the native TOOL_LOCATE_SENSOR so its result is tagged as a sensor location
# (an ABSOLUTE coordinate, NOT a tool offset) and can never be saved as an offset.
[gcode_macro TOOL_LOCATE_SENSOR]
rename_existing: _BASE_TOOL_LOCATE_SENSOR
description: Locate calibration sensor (T0), then mark result as a sensor location.
gcode:
    _BASE_TOOL_LOCATE_SENSOR {rawparams}
    _RECORD_CALIB_RESULT KIND=sensor

# Heat + wait for the ACTIVE tool's extruder, resolving the heater AFTER selection
# (fixes review 2.1: the first-tool wait resolved printer.toolhead.extruder at
# render time - before SELECT_TOOL executed - and so waited on the PREVIOUS tool).
[gcode_macro _HEAT_AND_WAIT_ACTIVE]
description: Internal - heat active tool extruder to TEMP and wait (post-selection).
gcode:
    {% set t   = params.TEMP|default(150)|int %}
    {% set ext = printer.toolhead.extruder %}
    M104 S{t}
    {% if ext %}
      TEMPERATURE_WAIT SENSOR='{ext}' MINIMUM={t}
    {% endif %}

# Stage the freshly-measured ACTIVE tool's offset to ITS OWN section for
# SAVE_CONFIG. Called immediately after TOOL_CALIBRATE_TOOL_OFFSET while
# last_result still belongs to this tool (fixes review 2.3 ownership).
[gcode_macro _STAGE_ACTIVE_TOOL_OFFSET]
description: Internal - stage active tool's last_result offset to its own section.
gcode:
    {% set active = printer.toolchanger.tool %}
    {% set r      = printer.tools_calibrate.last_result %}
    {% if active %}
      TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="{active}" ATTRIBUTE=gcode_x_offset VALUE={% raw %}"{x:0.6f}"{% endraw %}
      TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="{active}" ATTRIBUTE=gcode_y_offset VALUE={% raw %}"{y:0.6f}"{% endraw %}
      TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="{active}" ATTRIBUTE=gcode_z_offset VALUE={% raw %}"{z:0.6f}"{% endraw %}
      RESPOND TYPE=echo MSG='Staged offset {r[0]}, {r[1]}, {r[2]} to {active}.'
    {% else %}
      { action_raise_error("_STAGE_ACTIVE_TOOL_OFFSET: no active tool.") }
    {% endif %}

# Move over the calibration switch in ABSOLUTE mode, preserving the caller's
# coordinate-system state (review 2.2: the moves inherited G91/relative from the
# caller and there was no homed precondition). RESTORE_GCODE_STATE without MOVE=1
# restores the mode/offset without moving the toolhead.
[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Move over the calibration switch (absolute mode, homed, state-safe).
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("CALIBRATE_MOVE_OVER_PROBE: home all axes first (G28).") }
    {% endif %}
    {% set sw = printer["gcode_macro _CALIBRATION_SWITCH"] %}
    SAVE_GCODE_STATE NAME=_CAL_MOVE_OVER_PROBE
    BED_MESH_CLEAR
    G90
    G0 Z{sw.z} F10000
    G0 X{sw.x} Y{sw.y} F10000
    RESTORE_GCODE_STATE NAME=_CAL_MOVE_OVER_PROBE

# Calibrate every tool's offset vs T0 and STAGE EACH RESULT TO ITS OWN TOOL
# SECTION immediately after measuring it (review 2.3). Requires homed axes.
# Heaters resolved via _HEAT_AND_WAIT_ACTIVE (fixes review 2.1). Explicit user
# SAVE_CONFIG required to persist - this macro never auto-restarts.
[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Calibrate all tool offsets vs T0, staging each to its own section.
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("CALIBRATE_ALL_OFFSETS: home all axes first (G28).") }
    {% endif %}
    {% set tools = printer.toolchanger.tool_numbers %}
    # Note: the legacy STOP_CRASH_DETECTION calls from the upstream body targeted the
    # OLD tool_probe detector and are inert with the new tool_crash module (review 3),
    # so they are removed here. The new detector naturally suppresses during the
    # calibration probe moves (they fire homing/probing events) and is typically not
    # even enabled outside a print.
    # --- Tool 0: locate the reference sensor ---
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XYZ
    CALIBRATE_MOVE_OVER_PROBE
    _HEAT_AND_WAIT_ACTIVE TEMP=150
    TOOL_LOCATE_SENSOR
    M104 S0
    # --- Remaining tools: measure offset, then stage to THAT tool immediately ---
    {% for tool in tools[1:] %}
        SELECT_TOOL T={tool} RESTORE_AXIS=Z
        CALIBRATE_MOVE_OVER_PROBE
        _HEAT_AND_WAIT_ACTIVE TEMP=150
        TOOL_CALIBRATE_TOOL_OFFSET
        _STAGE_ACTIVE_TOOL_OFFSET
        M104 S0
    {% endfor %}
    # Return to T0
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XYZ
    RESPOND TYPE=echo MSG='CALIBRATE_ALL_OFFSETS complete. Review the staged offsets, then run SAVE_CONFIG to persist (this will restart Klipper).'


##############################################################################
# 5. TOOL_ALIGN_TEST - dock-relative tolerance (review 4.3)
#
# The upstream body aborts whenever Y > 0, which rejects the configured (positive)
# dock Y values, making a legitimate near-dock test impossible. Replace the sign
# test with a dock-relative tolerance and require a known tool + homed axes.
# Dock coordinates are NOT changed.
##############################################################################
[gcode_macro TOOL_ALIGN_TEST]
description: Test tool docking near the current position (dock-relative, homed, known tool).
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
      RESPOND TYPE=error MSG='TOOL_ALIGN_TEST aborted: home all axes first (G28).'
    {% elif not printer.toolchanger.tool %}
      RESPOND TYPE=error MSG='TOOL_ALIGN_TEST aborted: no active tool detected.'
    {% else %}
      {% set curpos = printer.gcode_move.gcode_position %}
      {% set t = printer[printer.toolchanger.tool] %}
      {% set tol = 30.0 %}
      {% set dx = (curpos[0] - t.params_park_x|float)|abs %}
      {% set dy = (curpos[1] - t.params_park_y|float)|abs %}
      {% set dz = (curpos[2] - t.params_park_z|float)|abs %}
      {% if dx > tol or dy > tol or dz > tol %}
        RESPOND TYPE=error MSG='TOOL_ALIGN_TEST aborted: position is more than {tol}mm from the dock (dx={dx}, dy={dy}, dz={dz}). Jog nearer the dock first.'
      {% else %}
        INITIALIZE_TOOLCHANGER # Detect current tool
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        SET_TOOL_PARAMETER PARAMETER='params_park_x' VALUE={curpos[0]}
        SET_TOOL_PARAMETER PARAMETER='params_park_y' VALUE={curpos[1]}
        SET_TOOL_PARAMETER PARAMETER='params_park_z' VALUE={curpos[2]}
        TEST_TOOL_DOCKING RESTORE_AXIS=XYZ
      {% endif %}
    {% endif %}


##############################################################################
# 6. SAFE_SYNC_MOTORS - precondition-checked motor sync (review 5 / 5-motorsync)
#
# motors_sync uses T0's accelerometer (accel_chip: adxl345 T0), so a meaningful
# sync REQUIRES tool 0 physically mounted/detected. This is a descriptive
# precondition wrapper; it does not rename the native SYNC_MOTORS (which stays
# available for advanced/manual use).
##############################################################################
[gcode_macro SAFE_SYNC_MOTORS]
description: Run SYNC_MOTORS only when T0 is mounted/detected (T0 holds the accelerometer).
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
      { action_raise_error("SAFE_SYNC_MOTORS: home X and Y first (G28).") }
    {% elif printer.toolchanger.tool != 'tool T0' %}
      { action_raise_error("SAFE_SYNC_MOTORS: T0 must be the active tool (it carries the sync accelerometer). Run T0 first.") }
    {% elif printer.toolchanger.has_detection and printer.toolchanger.detected_tool_number != 0 %}
      { action_raise_error("SAFE_SYNC_MOTORS: T0 is not detected as mounted; refusing to sync.") }
    {% else %}
      # Hard guarantee: raises if T0 is not physically detected.
      VERIFY_TOOL_DETECTED T=0
      SYNC_MOTORS
    {% endif %}
